
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffcfb0">
    <title>LARCK - My Wallet</title>
    <link rel="stylesheet" href="wallet.css">
</head>
<body>


    <!-- HEADER -->
    <header class="wallet-header">
        <button class="back-button" id="backButton" aria-label="Go back">
            <svg viewBox="0 0 24 24">
                <path d="M15 18l-6-6 6-6"></path>
            </svg>
        </button>

        <h1>My Wallet</h1>

        <button class="history-button" id="historyButton">
            <svg viewBox="0 0 24 24">
                <path d="M3 5h13M3 10h9M3 15h7"></path>
                <circle cx="17" cy="16" r="5"></circle>
                <path d="M17 13v3l2 1"></path>
            </svg>
            <span>History</span>
        </button>
    </header>

    <main class="wallet-content">

        <!-- COIN BALANCE -->
        <section class="balance-card">
            <div class="big-coin" aria-hidden="true">
                <span>★</span>
            </div>

            <div class="balance-information">
                <span class="balance-label">My Coins</span>
                <strong id="coinBalance">0</strong>
            </div>
        </section>

        <!-- COIN SELLERS -->
        <button class="coin-sellers-button" id="coinSellersButton">
            <span class="seller-coin" aria-hidden="true">★</span>
            <span>Coin Sellers</span>
        </button>

        <!-- RECHARGE PACKAGES -->
        <h2 class="plans-heading">Best Recharge Plan</h2>

        <section class="recharge-grid" id="rechargeGrid">

            <button class="recharge-card" data-coins="7000" data-price="1">
                <span class="package-coin" aria-hidden="true">★</span>
                <strong class="package-amount">7000</strong>
                <span class="price-button">$1</span>
            </button>

            <button class="recharge-card" data-coins="35000" data-price="5">
                <span class="package-coin" aria-hidden="true">★</span>
                <strong class="package-amount">35000</strong>
                <span class="price-button">$5</span>
            </button>

            <button class="recharge-card" data-coins="70000" data-price="10">
                <span class="package-coin" aria-hidden="true">★</span>
                <strong class="package-amount">70000</strong>
                <span class="price-button">$10</span>
            </button>

            <button class="recharge-card" data-coins="700000" data-price="100">
                <span class="package-coin" aria-hidden="true">★</span>
                <strong class="package-amount">700000</strong>
                <span class="price-button">$100</span>
            </button>

            <button class="recharge-card" data-coins="1700000" data-price="200">
                <span class="package-coin" aria-hidden="true">★</span>
                <strong class="package-amount">1700000</strong>
                <span class="price-button">$200</span>
            </button>

        </section>

    </main>

      
    

<!-- FULL-SCREEN COIN SELLERS OVERLAY -->
<div class="coin-sellers-overlay" id="coinSellersOverlay">
    <div class="coin-sellers-panel">

        <div class="coin-sellers-header">
            <button
                type="button"
                id="closeCoinSellers"
                aria-label="Back to wallet"
            >&#8592;</button>

            <h2>Coin Sellers</h2>
        </div>

        <div class="coin-sellers-content">
            <!-- Coin seller list will be added here later -->
        </div>

    </div>
</div>



<!-- FULL-SCREEN HISTORY OVERLAY -->
<div class="history-overlay" id="historyOverlay">
    <div class="history-panel">

        <!-- HEADER -->
        <div class="history-header">
            <button type="button" id="closeHistory"
                aria-label="Back to wallet">&#8592;</button>
            <h2>History</h2>
            <div class="history-header-space"></div>
        </div>

        <div class="history-content">

            <!-- DATE RANGE -->
            <div class="history-date-card">
                <h3>Select Record Duration :</h3>

                <div class="history-date-grid">
                    <label class="history-date-field">
                        <span>Start Date:</span>
                        <div class="history-date-pill">
                            <input type="date" id="historyStartDate"
                                aria-label="Start date">
                            <span>▼</span>
                        </div>
                    </label>

                    <label class="history-date-field">
                        <span>End Date:</span>
                        <div class="history-date-pill">
                            <input type="date" id="historyEndDate"
                                aria-label="End date">
                            <span>▼</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- COINS CARD -->
            <button type="button" class="history-record-card history-coins"
                id="coinsHistoryButton">
                <div class="history-record-top">
                    <span class="history-coin-icon" aria-hidden="true">
                        <svg viewBox="0 0 40 40" width="28" height="28">
                            <circle cx="20" cy="20" r="17"
                                fill="#FFD66B" stroke="#FFF0B0" stroke-width="2"/>
                            <path d="M20 8 L23.5 15.5 L32 16.5
                                L25.8 22.3 L27.5 30.5 L20 26.3
                                L12.5 30.5 L14.2 22.3 L8 16.5
                                L16.5 15.5 Z" fill="#9A5C12"/>
                        </svg>
                    </span>

                    <span class="history-record-title">Coins</span>
                    <span class="history-record-badge">Record</span>
                    <span class="history-record-arrow">&raquo;</span>
                </div>

                <div class="history-record-stats">
                    <div>
                        <strong>0</strong>
                        <span>Income</span>
                    </div>
                    <div>
                        <strong>0</strong>
                        <span>Outcome</span>
                    </div>
                </div>
            </button>

            <!-- POINTS CARD -->
            <button type="button" class="history-record-card history-points"
                id="pointsHistoryButton">
                <div class="history-record-top">
                    <span class="history-points-icon" aria-hidden="true">P</span>

                    <span class="history-record-title">Points</span>
                    <span class="history-record-badge">Record</span>
                    <span class="history-record-arrow">&raquo;</span>
                </div>

                <div class="history-record-stats">
                    <div>
                        <strong id="pointsIncomeValue">0</strong>
                          <span>Income</span>
                    </div>
                    <div>
                        <strong>0</strong>
                        <span>Outcome</span>
                    </div>
                </div>
            </button>

        </div>
    </div>
</div>




    <!-- WALLET MESSAGE -->
    <div class="wallet-toast" id="walletToast" role="status"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="wallet.js"></script>
</body>
</html>
