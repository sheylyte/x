<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LARCK - Home</title>

    <link rel="stylesheet" href="page2.css">
</head>

<body>

    <!-- =====================================
         TOP AREA
    ====================================== -->

    <header class="home-header">

        <div class="top-navigation">

            <div class="home-tabs">

                <button class="top-tab" data-tab="follow">
                    Follow
                </button>

                <button class="top-tab active" data-tab="hot">
                    Hot
                </button>

                <button class="top-tab" data-tab="new">
                    New
                </button>

            </div>


           <div class="header-icons">

    <button class="icon-button" id="searchButton">
        <span class="search-icon"></span>
    </button>

    <button class="icon-button" id="notificationButton">
        <span class="notification-icon">🔔</span>
        <span class="notification-dot"></span>
    </button>

</div>

</div>


<!-- SEARCH BAR -->

<div class="home-search" id="homeSearch">

    <button class="search-back" id="searchBackButton">
        ←
    </button>

    <div class="home-search-box">

        <span class="search-icon"></span>

        <input
            type="text"
            id="homeSearchInput"
            placeholder="Search by LARCK ID..."
            autocomplete="off"
        >

    </div>

</div>

  <div class="user-search-results" id="userSearchResults"></div>


        <!-- =====================================
             COUNTRY FILTER
        ====================================== -->

        <div class="country-area">

            <button class="country-all active" id="allCountryButton">
                All
            </button>


            <div class="country-scroll" id="countryScroll">

                <button class="country-button">
                    🇳🇬 <span>Nigeria</span>
                </button>

                <button class="country-button">
                    🇬🇭 <span>Ghana</span>
                </button>

                <button class="country-button">
                    🇵🇭 <span>Philippines</span>
                </button>

                <button class="country-button">
                    🇺🇸 <span>USA</span>
                </button>

                <button class="country-button">
                    🇬🇧 <span>UK</span>
                </button>

            </div>


            <button class="country-more" id="countryMoreButton">
               ⌄
            </button>

        </div>

    </header>


    <!-- =====================================
         MAIN CONTENT
    ====================================== -->

    <main class="home-content">


       
<!-- LARCK BANNER CAROUSEL -->
<section class="larck-carousel" id="larckCarousel" aria-label="LARCK promotions">

    <div class="larck-carousel-track" id="larckCarouselTrack">

       <div class="larck-carousel-track" id="larckCarouselTrack">
    <div class="larck-banner-loading">Loading banners...</div>
</div>

<div
    class="larck-carousel-dots"
    id="larckCarouselDots"
    aria-label="Banner slides"
></div>
    </div>

    <div class="larck-carousel-dots" id="larckCarouselDots" aria-label="Banner slides">
        <span class="active"></span>
        <span></span>
        <span></span>
    </div>

</section>



        <!-- =====================================
             POPULAR PARTY
        ====================================== -->

        <section class="home-section">

            <div class="section-title">

                <h2>Popular Parties</h2>

                <button class="see-all-button" id="popularSeeAll">
                    See all
                </button>

            </div>



                
<div class="party-grid" id="popularPartyGrid">
    <div class="party-loading">Loading parties...</div>
</div>

      
    </article>

            </div>

        </section>


       
        
    <!-- =====================================
         CREATE PARTY BUTTON
    ====================================== -->

    <button class="create-party-button" id="createPartyButton">

        <span>🎙️</span>

    </button>


    <!-- =====================================
     FANCY BOTTOM NAVIGATION
====================================== -->

<nav class="bottom-navigation">

    <!-- HOME -->

    <button class="bottom-nav-item active" data-page="home">

        <span class="bottom-icon">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 10.8L12 3l9 7.8"></path>
                <path d="M5.5 9.8V21h13V9.8"></path>
                <path d="M9.5 21v-6h5v6"></path>
            </svg>

        </span>

        <span class="bottom-label">
            Home
        </span>

    </button>


    <!-- PARTY -->

    <button class="bottom-nav-item" data-page="party">

        <span class="bottom-icon">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 21h16"></path>
                <path d="M6 18v-6"></path>
                <path d="M10 18V8"></path>
                <path d="M14 18v-9"></path>
                <path d="M18 18V5"></path>
                <path d="M6 5l4-2 4 3 4-2"></path>
            </svg>

        </span>

        <span class="bottom-label">
            Party
        </span>

    </button>


    <!-- MESSAGE -->

    <button class="bottom-nav-item" data-page="message">

        <span class="bottom-icon">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 11.5a7.5 7.5 0 0 1-8 7.5
                         8.6 8.6 0 0 1-3.2-.6
                         L4 20l1.6-3.8
                         A7.1 7.1 0 0 1 4 11.5
                         7.5 7.5 0 0 1 12 4
                         7.5 7.5 0 0 1 20 11.5Z">
                </path>

                <path d="M8 11.5h.01"></path>
                <path d="M12 11.5h.01"></path>
                <path d="M16 11.5h.01"></path>
            </svg>

        </span>

        <span class="bottom-label">
            Message
        </span>

    </button>


    <!-- ME -->

    <button class="bottom-nav-item" data-page="me">

        <span class="bottom-icon">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="3.5"></circle>
                <path d="M5 21c.7-4 3.2-6 7-6s6.3 2 7 6"></path>
            </svg>

        </span>

        <span class="bottom-label">
            Me
        </span>

    </button>

</nav>

    <!-- =====================================
         COUNTRY POPUP
    ====================================== -->

    <div class="popup-overlay" id="countryPopup">

        <div class="country-popup">

            <button class="popup-close" id="closeCountryPopup">
                ×
            </button>

            <h2>Select Country</h2>

            <p>
                Discover parties from different countries.
            </p>


            <div class="all-countries">

                <button>🌍 All</button>
                <button>🇳🇬 Nigeria</button>
                <button>🇬🇭 Ghana</button>
                <button>🇰🇪 Kenya</button>
                <button>🇿🇦 South Africa</button>
                <button>🇺🇸 United States</button>
                <button>🇬🇧 United Kingdom</button>
                <button>🇨🇦 Canada</button>
                <button>🇵🇭 Philippines</button>
                <button>🇮🇳 India</button>
                <button>🇨🇳 China</button>
                <button>🇯🇵 Japan</button>
                <button>🇰🇷 South Korea</button>
                <button>🇦🇪 United Arab Emirates</button>
                <button>🇸🇦 Saudi Arabia</button>
                <button>🇹🇷 Turkey</button>
                <button>🇩🇪 Germany</button>
                <button>🇫🇷 France</button>
                <button>🇮🇹 Italy</button>
                <button>🇪🇸 Spain</button>

            </div>

        </div>

    </div>

    </div>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="page2.js"></script>

    <script src="room-presence.js"></script>

</body>

</html>
